<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뽀로로반 문구 레이싱 3D</title>
  <style>
    :root {
      --primary: #ffb703;
      --accent: #fb8500;
      --dark: #1e293b;
      --light: #f8fafc;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 속도선 이펙트 (부스터 발동 시) */
    #speed-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      background: radial-gradient(circle, transparent 45%, rgba(255, 230, 100, 0.35) 85%, rgba(255, 120, 0, 0.65) 100%);
      z-index: 5;
    }
    #speed-lines.active {
      opacity: 1;
      animation: pulseSpeed 0.18s infinite alternate;
    }
    @keyframes pulseSpeed {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    /* 공통 오버레이 화면 */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
    }
    .hidden {
      display: none !important;
    }

    /* 상단 설정 바 (화질, 자동가속, 난이도, 소리) */
    #top-settings {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .setting-btn {
      background: rgba(255, 255, 255, 0.92);
      color: #1e293b;
      border: 2px solid #cbd5e1;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .setting-btn.on {
      background: #fef08a;
      border-color: #eab308;
      color: #854d0e;
    }

    /* 타이틀 및 레이서 선택 화면 */
    .title-header {
      text-align: center;
      margin-bottom: 12px;
      color: #fff;
    }
    .title-badge {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 4px;
    }
    .title-header h1 {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 900;
      text-shadow: 0 3px 0 #0f172a;
      letter-spacing: -0.5px;
    }
    .title-header p {
      font-size: 14px;
      color: #e2e8f0;
      margin-top: 2px;
    }

    .racer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 210px));
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 14px;
    }
    @media (max-width: 740px) {
      .racer-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: 62vh;
        overflow-y: auto;
      }
    }
    .racer-card {
      background: #ffffff;
      border: 4px solid #334155;
      border-radius: 18px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .racer-card.selected {
      border-color: #f59e0b;
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.35);
    }
    .racer-preview {
      height: 82px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 8px;
      position: relative;
      border: 2px solid rgba(0,0,0,0.06);
    }
    .racer-num {
      position: absolute;
      bottom: 4px;
      right: 8px;
      font-size: 11px;
      font-weight: 900;
      background: #fff;
      color: #1e293b;
      border: 1.5px solid #1e293b;
      border-radius: 99px;
      padding: 1px 6px;
    }
    .racer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .racer-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }
    .racer-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1.5px solid #1e293b;
    }
    .racer-desc {
      font-size: 11.5px;
      color: #475569;
      line-height: 1.35;
      margin-bottom: 6px;
      min-height: 30px;
    }
    .racer-skill {
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .racer-skill strong {
      display: block;
      color: #0f172a;
      margin-bottom: 1px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      font-size: 10.5px;
      color: #334155;
      margin-top: 3px;
      gap: 6px;
    }
    .stat-label {
      width: 42px;
      font-weight: 700;
    }
    .stat-bar-bg {
      flex: 1;
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 99px;
    }

    .primary-btn {
      background: linear-gradient(180deg, #facc15 0%, #f59e0b 100%);
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 999px;
      padding: 12px 38px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #0f172a;
      transition: transform 0.1s;
    }
    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0f172a;
    }
    .secondary-btn {
      background: #e2e8f0;
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 999px;
      padding: 12px 26px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #0f172a;
    }

    /* HUD */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .hud-top-left {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rank-box {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #facc15;
      color: #fff;
      border-radius: 16px;
      padding: 6px 14px;
      text-align: center;
      min-width: 84px;
    }
    .rank-num {
      font-size: 32px;
      font-weight: 900;
      color: #facc15;
      line-height: 1;
    }
    .rank-total {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 700;
    }
    .lap-box {
      background: rgba(15, 23, 42, 0.82);
      border: 2px solid #94a3b8;
      color: #fff;
      border-radius: 14px;
      padding: 7px 14px;
      font-weight: 800;
      font-size: 16px;
    }
    .lap-box span {
      color: #38bdf8;
      font-size: 20px;
    }

    /* 아이템 슬롯 (상단 중앙) */
    .hud-top-center {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .item-slot {
      width: 78px;
      height: 78px;
      background: rgba(15, 23, 42, 0.88);
      border: 4px solid #fff;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .item-slot-icon {
      font-size: 34px;
      line-height: 1;
    }
    .item-slot-name {
      font-size: 11px;
      font-weight: 800;
      color: #fde047;
      margin-top: 3px;
    }

    /* 부스터 게이지 및 충전 슬롯 */
    .boost-hud {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.82);
      padding: 5px 10px;
      border-radius: 999px;
      border: 2px solid #475569;
    }
    .boost-pip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .boost-pip.ready {
      background: linear-gradient(135deg, #f97316, #facc15);
      border-color: #fff;
      box-shadow: 0 0 10px #f97316;
    }
    .drift-bar-wrap {
      width: 90px;
      height: 10px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
      border: 1.5px solid #64748b;
    }
    .drift-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #facc15, #f97316);
      transition: width 0.06s linear;
    }

    /* 미니맵 */
    #minimap {
      position: absolute;
      top: 54px;
      right: 14px;
      width: 116px;
      height: 116px;
      background: rgba(15, 23, 42, 0.78);
      border: 2.5px solid #cbd5e1;
      border-radius: 16px;
    }

    /* 중앙 알림 배너 (카운트다운, 역전, 아이템 피격 안내) */
    #center-banner {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(32px, 7vw, 68px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 0 #0f172a, 0 0 24px rgba(250, 204, 21, 0.8);
      pointer-events: none;
      text-align: center;
      z-index: 15;
    }
    #event-toast {
      position: absolute;
      top: 138px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border: 2px solid #facc15;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 15;
      white-space: nowrap;
    }

    /* 터치 컨트롤 버튼 (엄지 친화적 크기) */
    .touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .left-pad {
      position: absolute;
      bottom: 18px;
      left: 18px;
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    .right-pad {
      position: absolute;
      bottom: 18px;
      right: 18px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .ctrl-btn {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      border: 3.5px solid rgba(255, 255, 255, 0.9);
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
      cursor: pointer;
    }
    .ctrl-btn span {
      font-size: 11px;
      font-weight: 800;
      margin-top: 2px;
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      transform: scale(0.93);
      background: rgba(250, 204, 21, 0.88);
      color: #0f172a;
    }
    .ctrl-btn.item-btn {
      background: rgba(14, 165, 233, 0.85);
      width: 86px;
      height: 86px;
    }
    .ctrl-btn.drift-btn {
      background: rgba(249, 115, 22, 0.85);
      width: 86px;
      height: 86px;
    }
    .ctrl-btn.accel-btn {
      background: rgba(34, 197, 94, 0.82);
      width: 72px;
      height: 72px;
    }

    /* 결과 화면 */
    .result-card {
      background: #fff;
      border: 4px solid #0f172a;
      border-radius: 24px;
      padding: 22px 28px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 0 #0f172a;
    }
    .result-rank-badge {
      font-size: 46px;
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 0 2px 0 #0f172a;
      margin: 4px 0;
    }
    .result-time {
      font-size: 16px;
      font-weight: 800;
      color: #475569;
      margin-bottom: 14px;
    }
    .reflection-box {
      background: #fef9c3;
      border: 2px dashed #eab308;
      border-radius: 14px;
      padding: 12px;
      text-align: left;
      font-size: 13.5px;
      color: #713f12;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .reflection-box strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      color: #854d0e;
    }
    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 3D 캔버스 및 부스터 속도선 -->
  <canvas id="game-canvas"></canvas>
  <div id="speed-lines"></div>

  <!-- 우측 상단 글로벌 옵션 바 -->
  <div id="top-settings">
    <button id="btn-auto-accel" class="setting-btn on">🚗 자동 가속: 켜짐</button>
    <button id="btn-difficulty" class="setting-btn">🤖 난이도: 보통</button>
    <button id="btn-quality" class="setting-btn">✨ 화질: 보통</button>
    <button id="btn-sound" class="setting-btn on">🔊 효과음: 켜짐</button>
  </div>

  <!-- 1. 타이틀 & 레이서 선택 화면 (설명 없이 30초 내 즉시 시작 가능) -->
  <div id="select-screen" class="screen">
    <div class="title-header">
      <span class="title-badge">6학년 게임 리터러시 · 뽀로로반 레이싱</span>
      <h1>✏️ 문구류 그랑프리 3D 레이싱</h1>
      <p>문구류에서 태어난 레이서를 고르고 <strong>드리프트 부스터</strong>와 <strong>역전 아이템</strong>으로 승부하세요!</p>
    </div>

    <div id="racer-grid" class="racer-grid"></div>

    <button id="btn-start-race" class="primary-btn">🏁 레이스 출발하기!</button>
  </div>

  <!-- 2. 레이스 HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top-left">
      <div class="rank-box">
        <div id="hud-rank" class="rank-num">1위</div>
        <div class="rank-total">/ 8명</div>
      </div>
      <div class="lap-box">
        바퀴 <span id="hud-lap">1</span> / 3
      </div>
    </div>

    <div class="hud-top-center">
      <div id="hud-item-slot" class="item-slot">
        <div id="hud-item-icon" class="item-slot-icon">🎲</div>
        <div id="hud-item-name" class="item-slot-name">아이템 상자 통과</div>
      </div>
      <div class="boost-hud">
        <div id="pip-1" class="boost-pip">⚡</div>
        <div id="pip-2" class="boost-pip">⚡</div>
        <div class="drift-bar-wrap">
          <div id="drift-bar" class="drift-bar-fill"></div>
        </div>
      </div>
    </div>

    <canvas id="minimap" width="116" height="116"></canvas>

    <!-- 터치 조작 버튼 (키보드 동시 지원) -->
    <div class="touch-controls">
      <div class="left-pad">
        <button id="touch-left" class="ctrl-btn">◀<span>왼쪽(←)</span></button>
        <button id="touch-right" class="ctrl-btn">▶<span>오른쪽(→)</span></button>
      </div>
      <div class="right-pad">
        <button id="touch-item" class="ctrl-btn item-btn">🎁<span>아이템(Space)</span></button>
        <button id="touch-drift" class="ctrl-btn drift-btn">🔥<span>드리프트(Shift)</span></button>
        <button id="touch-accel" class="ctrl-btn accel-btn">⬆️<span>가속(↑)</span></button>
      </div>
    </div>
  </div>

  <!-- 중앙 카운트다운 및 이벤트 알림 -->
  <div id="center-banner" class="hidden">3</div>
  <div id="event-toast"></div>

  <!-- 3. 결과 화면 -->
  <div id="result-screen" class="screen hidden">
    <div class="result-card">
      <div style="font-size:14px; font-weight:800; color:#64748b;">🏁 3바퀴 완주 성공!</div>
      <div id="result-rank" class="result-rank-badge">1위 골인!</div>
      <div id="result-time" class="result-time">기록: 01:42.50 · 선택한 레이서: 슝이</div>

      <div class="reflection-box">
        <strong>📝 활동지 기록 힌트 (1차시: 게임이란 무엇일까?)</strong>
        • 방금 레이스에서 <b>가장 재미있거나 짜릿했던 순간</b>은 언제였나요?<br/>
        • 골인 직후 <b>왜 "한 판만 더!" 버튼을 누르고 싶은 마음</b>이 들까요?
      </div>

      <div class="result-actions">
        <button id="btn-retry" class="primary-btn">🔥 한 번 더!</button>
        <button id="btn-change-racer" class="secondary-btn">🔄 레이서 바꾸기</button>
      </div>
    </div>
  </div>

  <script>
    /********************************************************************
     * 1. CONFIG: 수업 밸런스, 아이템 수치, 문구류 레이서 도감 데이터 통합 관리
     ********************************************************************/
    const CONFIG = {
      totalLaps: 3,
      totalRacers: 8,
      baseMaxSpeed: 54,
      boostBonusSpeed: 26,
      boostDuration: 1.5,        // 부스터 지속 시간 1.5초
      maxBoostCharges: 2,        // 부스터 최대 2개 보관
      driftChargeRate: 0.72,     // 드리프트 시 초당 게이지 충전율

      // 난이도별 AI 기본 속도 배율
      aiDifficulty: {
        easy:   { label: '쉬움', speedMul: 0.88, rubberBandCatchup: 1.12, rubberBandSlowdown: 0.86 },
        normal: { label: '보통', speedMul: 0.96, rubberBandCatchup: 1.16, rubberBandSlowdown: 0.89 },
        hard:   { label: '어려움', speedMul: 1.02, rubberBandCatchup: 1.20, rubberBandSlowdown: 0.93 }
      },

      // 오리지널 문구류 아이템 정의 (1등을 완전히 망가뜨리지 않고 1~2초 추격 기회를 주는 밸런스)
      items: {
        eraserTrap: {
          id: 'eraserTrap',
          name: '지우개 가루 뭉치',
          icon: '🧼',
          desc: '트랙에 미끄러운 지우개 뭉치를 놓아 밟은 차를 1.2초 감속!'
        },
        paperShield: {
          id: 'paperShield',
          name: '색종이 방어막',
          icon: '🛡️',
          desc: '3.5초 동안 모든 방해 아이템을 1회 막아주는 보호막!'
        },
        pencilBooster: {
          id: 'pencilBooster',
          name: '연필심 로켓 부스터',
          icon: '🚀',
          desc: '1.5초 동안 강력한 순간 가속!'
        },
        inkSplash: {
          id: 'inkSplash',
          name: '잉크 물방울 폭탄',
          icon: '💧',
          desc: '바로 앞 순위 레이서에게 잉크를 튀겨 1.4초간 속도를 늦춤!'

    /********************************************************************
     * 2. Web Audio API 자체 효과음 합성기 (외부 오디오 파일 불필요)
     ********************************************************************/
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      beep(freq = 440, duration = 0.12, type = 'sine', slideTo = null, vol = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }
      playCountdown(isGo = false) {
        if (isGo) this.beep(880, 0.35, 'triangle', 1100, 0.22);
        else this.beep(440, 0.18, 'sine', null, 0.18);
      }
      playBoost() {
        this.beep(260, 0.38, 'sawtooth', 920, 0.18);
      }
      playItemPickup() {
        this.beep(520, 0.1, 'triangle', 880, 0.16);
        setTimeout(() => this.beep(780, 0.12, 'triangle', 1180, 0.16), 70);
      }
      playHit() {
        this.beep(300, 0.25, 'sawtooth', 110, 0.2);
      }
      playWin() {
        [523, 659, 784, 1046].forEach((f, idx) => {
          setTimeout(() => this.beep(f, 0.18, 'triangle', null, 0.2), idx * 110);
        });
      }
    }
    const sfx = new SoundFX();

    /********************************************************************
     * 4. 트랙 생성 및 경로(Spline) 계산 모듈 (쉬운 넓은 트랙 1종)
     ********************************************************************/
    const TRACK_WIDTH = 24; // 6학년 학생들이 쉽게 주행할 수 있는 넉넉한 도로 폭
    const TRACK_SAMPLES = 360;
    let trackCurve = null;
    let trackPoints = [];
    let trackTotalLength = 1;

    function buildTrack(scene) {
      // 큰 커브 3개와 직선 구간이 조화된 2~3분 분량 서킷
      const controlPoints = [
        new THREE.Vector3(0, 0, -140),
        new THREE.Vector3(0, 0, 120),
        new THREE.Vector3(95, 0, 210),
        new THREE.Vector3(230, 0, 145),
        new THREE.Vector3(215, 0, -10),
        new THREE.Vector3(120, 0, -70),
        new THREE.Vector3(205, 0, -195),
        new THREE.Vector3(75, 0, -255)
      ];
      trackCurve = new THREE.CatmullRomCurve3(controlPoints, true, 'catmullrom', 0.5);
      trackTotalLength = trackCurve.getLength();
      trackPoints = trackCurve.getSpacedPoints(TRACK_SAMPLES);

      // 도로 표면 및 홍백 연석 리본 메쉬 생성
      const roadGeo = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const indices = [];

      const halfW = TRACK_WIDTH * 0.5;
      const curbW = 2.2;

      for (let i = 0; i <= TRACK_SAMPLES; i++) {
        const t = i / TRACK_SAMPLES;
        const pt = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t).normalize();
        const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();

        const pLL = pt.clone().addScaledVector(normal, -(halfW + curbW));
        const pL  = pt.clone().addScaledVector(normal, -halfW);
        const pR  = pt.clone().addScaledVector(normal, halfW);
        const pRR = pt.clone().addScaledVector(normal, halfW + curbW);

        positions.push(
          pLL.x, 0.03, pLL.z,
          pL.x,  0.04, pL.z,
          pR.x,  0.04, pR.z,
          pRR.x, 0.03, pRR.z
        );

        const isStripe = (i % 4 < 2);
        const curbColor = isStripe ? [0.95, 0.25, 0.25] : [0.98, 0.98, 0.98];
        const roadColor = (i % 8 < 4) ? [0.27, 0.31, 0.38] : [0.24, 0.28, 0.35];

        colors.push(...curbColor, ...roadColor, ...roadColor, ...curbColor);

        if (i < TRACK_SAMPLES) {
          const base = i * 4;
          // 좌측 연석
          indices.push(base, base + 4, base + 1, base + 1, base + 4, base + 5);
          // 중앙 아스팔트 도로
          indices.push(base + 1, base + 5, base + 2, base + 2, base + 5, base + 6);
          // 우측 연석
          indices.push(base + 2, base + 6, base + 3, base + 3, base + 6, base + 7);
        }
      }

      roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      roadGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      roadGeo.setIndex(indices);
      roadGeo.computeVertexNormals();

      const roadMat = new THREE.MeshLambertMaterial({ vertexColors: true });
      const roadMesh = new THREE.Mesh(roadGeo, roadMat);
      scene.add(roadMesh);

      // 출발/결승선 체커 아치
      const startPt = trackCurve.getPointAt(0);
      const startTan = trackCurve.getTangentAt(0).normalize();
      const archGroup = new THREE.Group();
      archGroup.position.copy(startPt);
      archGroup.rotation.y = Math.atan2(startTan.x, startTan.z);

      const pillarMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
      const bannerMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 12, 10), pillarMat);
      pL.position.set(-halfW, 6, 0);
      const pR = pL.clone();
      pR.position.x = halfW;
      const topBar = new THREE.Mesh(new THREE.BoxGeometry(TRACK_WIDTH + 3, 2.4, 1.2), bannerMat);
      topBar.position.set(0, 11.2, 0);

      // 바닥 결승선 타일
      const finishStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(TRACK_WIDTH, 3.2),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      finishStrip.rotation.x = -Math.PI / 2;
      finishStrip.position.y = 0.08;

      archGroup.add(pL, pR, topBar, finishStrip);
      scene.add(archGroup);

      // 교실 책상 위 문구류 테마 장식물 (거대 연필 기둥, 나무 그래픽)
      const propColors = [0xf87171, 0x60a5fa, 0xfbbf24, 0x34d399, 0xa78bfa];
      for (let i = 0; i < 28; i++) {
        const t = i / 28;
        const pt = trackCurve.getPointAt(t);
        const tan = trackCurve.getTangentAt(t);
        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
        const side = (i % 2 === 0 ? 1 : -1) * (halfW + 16 + (i % 3) * 8);
        const pos = pt.clone().addScaledVector(norm, side);

        const pencilTower = new THREE.Group();
        const col = propColors[i % propColors.length];
        const body = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 14, 8), new THREE.MeshLambertMaterial({ color: col }));
        body.position.y = 7;
        const tip = new THREE.Mesh(new THREE.ConeGeometry(2.2, 4.5, 8), new THREE.MeshLambertMaterial({ color: 0xfde68a }));
        tip.position.y = 16.2;
        pencilTower.add(body, tip);
        pencilTower.position.copy(pos);
        scene.add(pencilTower);
      }
    }

    // 월드 좌표 -> 트랙 중심선 가장 가까운 진행도(s: 0~1) 및 횡오프셋 계산
    function getTrackProjection(pos, hintIndex = null) {
      let bestIdx = 0;
      let bestDistSq = Infinity;

      if (hintIndex !== null) {
        // 주변 인덱스 우선 탐색으로 태블릿 CPU 부하 절감
        const range = 25;
        for (let d = -range; d <= range; d++) {
          const idx = (hintIndex + d + TRACK_SAMPLES) % TRACK_SAMPLES;
          const pt = trackPoints[idx];
          const dx = pos.x - pt.x;
          const dz = pos.z - pt.z;
          const dSq = dx * dx + dz * dz;
          if (dSq < bestDistSq) {
            bestDistSq = dSq;
            bestIdx = idx;
          }
        }
      } else {
        for (let i = 0; i < TRACK_SAMPLES; i++) {
          const pt = trackPoints[i];
          const dx = pos.x - pt.x;
          const dz = pos.z - pt.z;
          const dSq = dx * dx + dz * dz;
          if (dSq < bestDistSq) {
            bestDistSq = dSq;
            bestIdx = idx;
          }
        }
      }

      const centerPt = trackPoints[bestIdx];
      const nextPt = trackPoints[(bestIdx + 1) % TRACK_SAMPLES];
      const tangent = new THREE.Vector3().subVectors(nextPt, centerPt).normalize();
      const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
      const offsetVec = new THREE.Vector3().subVectors(pos, centerPt);
      const lateralOffset = offsetVec.dot(normal);

      return {
        index: bestIdx,
        s: bestIdx / TRACK_SAMPLES,
        centerPt,
        tangent,
        normal,
        lateralOffset,
        dist: Math.sqrt(bestDistSq)
      };
    }

    /********************************************************************
     * 5. 아이템 상자(3구간 × 4개 = 12개) 및 트랙 함정 관리
     ********************************************************************/
    const itemBoxes = [];
    const activeTraps = [];

    function buildItemBoxes(scene) {
      const boxZones = [0.18, 0.52, 0.82]; // 트랙 3구간
      const laneOffsets = [-7.5, -2.5, 2.5, 7.5];

      const geo = new THREE.OctahedronGeometry(1.45, 0);
      const mat = new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.35 });

      boxZones.forEach(s => {
        const pt = trackCurve.getPointAt(s);
        const tan = trackCurve.getTangentAt(s).normalize();
        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

        laneOffsets.forEach(off => {
          const mesh = new THREE.Mesh(geo, mat);
          const pos = pt.clone().addScaledVector(norm, off);
          pos.y = 1.8;
          mesh.position.copy(pos);
          scene.add(mesh);
          itemBoxes.push({ mesh, pos, cooldown: 0 });
        });
      });
    }

    function spawnEraserTrap(scene, pos) {
      const geo = new THREE.BoxGeometry(2.2, 0.9, 1.5);
      const mat = new THREE.MeshLambertMaterial({ color: 0xf472b6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, 0.5, pos.z);
      scene.add(mesh);
      activeTraps.push({ mesh, pos: mesh.position.clone(), life: 18 });
    }

    /********************************************************************
     * 6. 레이서 상태 클래스 (플레이어 1명 + AI 7명)
     ********************************************************************/
    class Racer {
      constructor(index, racerData, isPlayer, scene) {
        this.index = index;
        this.data = racerData;
        this.isPlayer = isPlayer;
        this.name = isPlayer ? `${racerData.name}(나)` : `${racerData.name} AI ${index}`;

        this.mesh = createRacerKartMesh(racerData, index + 1);
        scene.add(this.mesh);

        // AI는 트랙 내 고유 선호 차선을 가짐
        this.aiPreferredLane = ((index % 4) - 1.5) * 4.2;
        this.aiSpeedVariance = 0.97 + (index % 3) * 0.02;
        this.resetForRace();
      }

      resetForRace() {
        // 출발 그리드 배치 (2열 4줄)
        const row = Math.floor(this.index / 2);
        const col = (this.index % 2 === 0) ? -4.2 : 4.2;
        const startS = (1 - (row * 0.012 + 0.01)) % 1;
        const pt = trackCurve.getPointAt(startS);
        const tan = trackCurve.getTangentAt(startS).normalize();
        const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

        this.pos = pt.clone().addScaledVector(norm, col);
        this.heading = Math.atan2(tan.x, tan.z);
        this.speed = 0;

        this.lap = 1;
        this.lastS = startS;
        this.hintIdx = Math.floor(startS * TRACK_SAMPLES);
        this.totalProgress = startS - 1; // 출발선 직전에서 시작
        this.rank = this.index + 1;
        this.finished = false;
        this.finishTime = 0;

        // 드리프트 및 부스터 상태
        this.isDrifting = false;
        this.driftDir = 0;
        this.driftGauge = 0;
        this.boostCharges = 0;
        this.boostTimer = 0;

        // 아이템 및 상태이상 타이머
        this.heldItem = null;
        this.aiItemWait = 0;
        this.slowTimer = 0;
        this.shieldTimer = 0;
        this.magnetTimer = 0;
        this.warpTimer = 0;

        this.syncMesh();
      }

      syncMesh() {
        this.mesh.position.copy(this.pos);
        // 드리프트 중에는 차체를 살짝 옆으로 틀어 시각적 피드백 강화
        const driftVisualYaw = this.isDrifting ? this.driftDir * 0.26 : 0;
        this.mesh.rotation.y = this.heading + driftVisualYaw;

        const flames = this.mesh.userData.flames;
        if (flames) {
          const showFlame = (this.boostTimer > 0 || this.warpTimer > 0);
          flames[0].visible = showFlame;
          flames[1].visible = showFlame;
        }
        if (this.mesh.userData.shieldMesh) {
          this.mesh.userData.shieldMesh.visible = (this.shieldTimer > 0);
        }
      }
    }

    /********************************************************************
     * 9. 순위 기반 아이템 추첨 및 사용 로직
     ********************************************************************/
    function rollItemByRank(rank, isClippy = false) {
      let pool = CONFIG.rankItemPools.mid;
      if (rank <= 2) pool = CONFIG.rankItemPools.top;
      else if (rank >= 6 || (isClippy && rank >= 4)) pool = CONFIG.rankItemPools.bottom;

      const totalWeight = pool.reduce((s, item) => s + item.weight, 0);
      let r = Math.random() * totalWeight;
      for (const entry of pool) {
        if (r < entry.weight) return CONFIG.items[entry.id];
        r -= entry.weight;
      }
      return CONFIG.items[pool[0].id];
    }

    function triggerBoost(racer, duration = CONFIG.boostDuration) {
      racer.boostTimer = Math.max(racer.boostTimer, duration * racer.data.bonus.boostDurMul);
      if (racer.isPlayer) {
        sfx.playBoost();
        document.getElementById('speed-lines').classList.add('active');
      }
    }

    function useActiveItemOrBoost(racer) {
      if (gameState !== 'RACING' || racer.finished) return;

      // 1) 아이템 슬롯에 아이템이 있으면 우선 사용
      if (racer.heldItem) {
        const item = racer.heldItem;
        racer.heldItem = null;

        if (item.id === 'pencilBooster') {
          triggerBoost(racer, 1.65);
          if (racer.isPlayer) showToast('🚀 연필심 로켓 부스터 발동!');
        } else if (item.id === 'paperShield') {
          racer.shieldTimer = 4.0;
          if (racer.isPlayer) {
            sfx.playItemPickup();
            showToast('🛡️ 색종이 방어막 가동!');
          }
        } else if (item.id === 'eraserTrap') {
          const backPos = racer.pos.clone().add(new THREE.Vector3(-Math.sin(racer.heading) * 3.2, 0, -Math.cos(racer.heading) * 3.2));
          spawnEraserTrap(scene, backPos);
          if (racer.isPlayer) showToast('🧼 지우개 가루 뭉치 설치 완료!');
        } else if (item.id === 'inkSplash') {
          // 바로 앞 순위 레이서 1명 감속 (억울하지 않게 1.3초만 살짝 감속)
          const target = racers.find(other => other.rank === racer.rank - 1);
          if (target) {
            applySlowEffect(target, 1.35, `${racer.name}의 잉크 물방울 폭탄!`);
            if (racer.isPlayer) showToast(`💧 앞선 ${target.data.name}에게 잉크 물폭탄 명중!`);
          } else {
            triggerBoost(racer, 1.2);
          }
        } else if (item.id === 'clipMagnet') {
          racer.magnetTimer = 2.0;
          triggerBoost(racer, 1.5);
          if (racer.isPlayer) showToast('🧲 클립 자석 견인! 앞차를 향해 끌려갑니다!');
        } else if (item.id === 'warpSpring') {
          racer.warpTimer = 2.4;
          racer.shieldTimer = 2.4;
          triggerBoost(racer, 2.4);
          if (racer.isPlayer) showToast('⚡ 용수철 워프 부스터! 초고속 자동 주행!');
        } else if (item.id === 'stickyNoteWave') {
          racers.forEach(other => {
            if (other !== racer && other.rank < racer.rank) {
              applySlowEffect(other, 1.4, '포스트잇 맞바람!');
            }
          });
          if (racer.isPlayer) showToast('🍃 포스트잇 바람개비로 상위권을 감속시켰습니다!');
        }

        if (racer.isPlayer) updateHUD();
        return;
      }

      // 2) 보유한 드리프트 부스터가 있으면 사용
      if (racer.boostCharges > 0) {
        racer.boostCharges--;
        triggerBoost(racer, CONFIG.boostDuration);
        if (racer.isPlayer) {
          showToast('🔥 드리프트 부스터 가속!');
          updateHUD();
        }
      }
    }

    function applySlowEffect(target, baseSeconds, reasonText) {
      if (target.shieldTimer > 0) {
        target.shieldTimer = 0;
        if (target.isPlayer) showToast('🛡️ 색종이 방어막으로 공격을 막았습니다!');
        return;
      }
      // 말랑(회복형) 등 캐릭터별 회복 보너스 적용
      const actualSec = baseSeconds / target.data.bonus.recoveryMul;
      target.slowTimer = Math.max(target.slowTimer, actualSec);
      target.speed *= 0.65;
      if (target.isPlayer) {
        sfx.playHit();
        showToast(`⚠️ ${reasonText} (잠시 감속)`);
      }
    }

    function bindTouchButton(id, keyName, onTap = null) {
      const btn = document.getElementById(id);
      const start = e => {
        e.preventDefault();
        btn.classList.add('pressed');
        if (keyName) input[keyName] = true;
        if (onTap) onTap();
      };
      const end = e => {

      };
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('touchcancel', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    /********************************************************************
     * 12. 물리 주행, 드리프트 부스터, AI 고무줄 보정 업데이트
     ********************************************************************/
    function updateRacerPhysics(racer, dt) {
      const proj = getTrackProjection(racer.pos, racer.hintIdx);
      racer.hintIdx = proj.index;

      // 랩(바퀴) 체크
      const ds = proj.s - racer.lastS;
      if (ds < -0.5) {
        racer.lap++;
        if (racer.isPlayer && racer.lap <= CONFIG.totalLaps) {
          showToast(`🏁 ${racer.lap}바퀴째 진입!${racer.lap === CONFIG.totalLaps ? ' (마지막 바퀴!)' : ''}`);
          sfx.playItemPickup();
        }
        if (racer.lap > CONFIG.totalLaps && !racer.finished) {
          racer.finished = true;
          racer.finishTime = raceElapsed;
          if (racer.isPlayer) finishPlayerRace();
        }
      } else if (ds > 0.5) {
        racer.lap--;
      }
      racer.lastS = proj.s;
      racer.totalProgress = (racer.lap - 1) + proj.s;

      // 타이머 감소
      if (racer.boostTimer > 0) {
        racer.boostTimer = Math.max(0, racer.boostTimer - dt);
        if (racer.isPlayer && racer.boostTimer === 0) {
          document.getElementById('speed-lines').classList.remove('active');
        }
      }
      if (racer.slowTimer > 0) racer.slowTimer = Math.max(0, racer.slowTimer - dt);
      if (racer.shieldTimer > 0) racer.shieldTimer = Math.max(0, racer.shieldTimer - dt);
      if (racer.magnetTimer > 0) racer.magnetTimer = Math.max(0, racer.magnetTimer - dt);
      if (racer.warpTimer > 0) racer.warpTimer = Math.max(0, racer.warpTimer - dt);

      // 최고 속도 계산
      let maxSpd = CONFIG.baseMaxSpeed * racer.data.bonus.topSpeedMul;
      if (!racer.isPlayer) {
        const diff = CONFIG.aiDifficulty[difficultyKey];
        maxSpd *= diff.speedMul * racer.aiSpeedVariance;

        // 고무줄 보정 (플레이어가 크게 뒤처지면 AI가 티 나지 않게 감속, 앞서면 적당히 추격)
        if (player) {
          const gap = player.totalProgress - racer.totalProgress;
          if (gap < -0.10) {
            maxSpd *= diff.rubberBandSlowdown;
          } else if (gap > 0.14) {
            maxSpd *= diff.rubberBandCatchup;
          }
        }
      }

      if (racer.boostTimer > 0) maxSpd += CONFIG.boostBonusSpeed;
      if (racer.warpTimer > 0) maxSpd += 14;
      if (racer.slowTimer > 0) maxSpd *= 0.62;

      // 조향 및 가속
      if (racer.isPlayer && racer.warpTimer <= 0) {
        const wantsAccel = autoAccel || input.up;
        if (wantsAccel) {
          racer.speed = THREE.MathUtils.lerp(racer.speed, maxSpd, dt * 3.2);
        } else {
          racer.speed = THREE.MathUtils.lerp(racer.speed, 0, dt * 2.5);
        }

        const steerInput = (input.left ? 1 : 0) + (input.right ? -1 : 0);
        const wantsDrift = input.drift && Math.abs(steerInput) > 0 && racer.speed > 22;

        if (wantsDrift) {
          racer.isDrifting = true;
          racer.driftDir = steerInput;
          racer.heading += steerInput * 2.15 * dt;

          // 드리프트 게이지 충전 (자로는 더 빠르게 충전)
          const chargeAdd = CONFIG.driftChargeRate * racer.data.bonus.driftChargeMul * dt;
          racer.driftGauge += chargeAdd;
          if (racer.driftGauge >= 1.0) {
            if (racer.boostCharges < CONFIG.maxBoostCharges) {
              racer.boostCharges++;
              sfx.playItemPickup();
              showToast(`⚡ 부스터 충전 완료! (${racer.boostCharges}/${CONFIG.maxBoostCharges})`);
            } else {
              // 슬롯이 꽉 차 있으면 즉시 미니 부스터 발동
              triggerBoost(racer, 1.1);
            }
            racer.driftGauge = 0;
          }
        } else {
          // 드리프트 버튼에서 손을 떼는 순간 게이지가 75% 이상이면 보너스 충전
          if (racer.isDrifting && racer.driftGauge >= 0.75 && racer.boostCharges < CONFIG.maxBoostCharges) {
            racer.boostCharges++;
            sfx.playItemPickup();
            showToast('⚡ 드리프트 부스터 획득!');
            racer.driftGauge = 0;
          }
          racer.isDrifting = false;
          racer.driftDir = 0;
          racer.heading += steerInput * 1.48 * dt;
          racer.driftGauge = Math.max(0, racer.driftGauge - dt * 0.25);
        }
      } else {
        // AI 주행 또는 플레이어의 용수철 워프 자동 주행
        racer.isDrifting = false;
        racer.speed = THREE.MathUtils.lerp(racer.speed, maxSpd, dt * 3.0);

        const lookAheadS = (proj.s + 0.035) % 1;
        const targetCenter = trackCurve.getPointAt(lookAheadS);
        const targetTan = trackCurve.getTangentAt(lookAheadS).normalize();
        const targetNorm = new THREE.Vector3(-targetTan.z, 0, targetTan.x).normalize();
        const laneOffset = racer.isPlayer ? 0 : racer.aiPreferredLane;
        const targetPt = targetCenter.addScaledVector(targetNorm, laneOffset);

        const desiredHeading = Math.atan2(targetPt.x - racer.pos.x, targetPt.z - racer.pos.z);
        let diffAngle = desiredHeading - racer.heading;
        while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
        while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
        racer.heading += THREE.MathUtils.clamp(diffAngle, -2.4 * dt, 2.4 * dt);

        // AI 아이템 사용 (과하게 플레이어만 노리지 않고 자연스럽게 사용)
        if (!racer.isPlayer && racer.heldItem) {
          racer.aiItemWait -= dt;
          if (racer.aiItemWait <= 0) {
            useActiveItemOrBoost(racer);
          }
        }
      }

      // 클립 자석 견인 효과 (앞 순위 차 방향으로 추가 가속)
      if (racer.magnetTimer > 0) {
        const ahead = racers.find(o => o.rank === Math.max(1, racer.rank - 1) && o !== racer);
        if (ahead) {
          const pullVec = new THREE.Vector3().subVectors(ahead.pos, racer.pos).normalize();
          racer.pos.addScaledVector(pullVec, 14 * dt);
        }
      }

      // 전진 이동
      racer.pos.x += Math.sin(racer.heading) * racer.speed * dt;
      racer.pos.z += Math.cos(racer.heading) * racer.speed * dt;

      // 트랙 경계 이탈 방지 (초등학생이 코스 밖으로 빠져 길을 잃지 않도록 부드럽게 복귀)
      const maxOffset = TRACK_WIDTH * 0.48;
      if (Math.abs(proj.lateralOffset) > maxOffset) {
        const sign = Math.sign(proj.lateralOffset);
        const excess = Math.abs(proj.lateralOffset) - maxOffset;
        racer.pos.addScaledVector(proj.normal, -sign * excess);
        // 말랑(회복형)은 벽 충돌 감속이 거의 없음
        const wallSlow = 1 - (0.12 / racer.data.bonus.recoveryMul) * dt;
        racer.speed *= wallSlow;
      }

      // 아이템 상자 획득 판정 (클리피는 자석 범위가 1.65배 넓음)
      const pickupRadius = 3.2 * racer.data.bonus.itemRadiusMul;
      itemBoxes.forEach(box => {
        if (box.cooldown <= 0) {
          const dist = racer.pos.distanceTo(box.pos);
          if (dist < pickupRadius) {
            box.cooldown = 3.5;
            box.mesh.visible = false;
            if (!racer.heldItem) {
              racer.heldItem = rollItemByRank(racer.rank, racer.data.id === 'clippy');
              if (racer.isPlayer) {
                sfx.playItemPickup();
                showToast(`🎁 [${racer.heldItem.name}] 획득! 아이템 버튼을 눌러보세요!`);
              } else {
                racer.aiItemWait = 1.5 + Math.random() * 2.5;
              }
            }
          }
        }
      });

      // 트랙 위 지우개 가루 뭉치 함정 충돌 판정
      for (let i = activeTraps.length - 1; i >= 0; i--) {
        const trap = activeTraps[i];
        if (racer.pos.distanceTo(trap.pos) < 2.3) {
          applySlowEffect(racer, 1.25, '지우개 가루 뭉치를 밟았습니다!');
          scene.remove(trap.mesh);
          activeTraps.splice(i, 1);
        }
      }

      racer.syncMesh();
    }

    // 카트 간 가벼운 밀어내기 물리
    function resolveKartCollisions() {
      const minDist = 2.4;
      for (let i = 0; i < racers.length; i++) {
        for (let j = i + 1; j < racers.length; j++) {
          const a = racers[i];
          const b = racers[j];
          const dx = b.pos.x - a.pos.x;
          const dz = b.pos.z - a.pos.z;
          const distSq = dx * dx + dz * dz;
          if (distSq > 0.001 && distSq < minDist * minDist) {
            const dist = Math.sqrt(distSq);
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const nz = dz / dist;
            a.pos.x -= nx * overlap;
            a.pos.z -= nz * overlap;
            b.pos.x += nx * overlap;
            b.pos.z += nz * overlap;
          }
        }
      }
    }

    /********************************************************************
     * 13. 순위 계산, HUD & 미니맵 업데이트, 결과 화면
     ********************************************************************/
    function updateRankings() {
      const sorted = [...racers].sort((a, b) => {
        if (a.finished && b.finished) return a.finishTime - b.finishTime;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.totalProgress - a.totalProgress;
      });
      sorted.forEach((r, idx) => { r.rank = idx + 1; });
    }

    const minimapCanvas = document.getElementById('minimap');
    const mCtx = minimapCanvas.getContext('2d');

    function updateHUD() {
      if (!player) return;
      document.getElementById('hud-rank').textContent = `${player.rank}위`;
      document.getElementById('hud-lap').textContent = Math.min(CONFIG.totalLaps, Math.max(1, player.lap));

      // 아이템 슬롯 & 부스터 표시
      const iconEl = document.getElementById('hud-item-icon');
      const nameEl = document.getElementById('hud-item-name');
      if (player.heldItem) {
        iconEl.textContent = player.heldItem.icon;
        nameEl.textContent = player.heldItem.name;
      } else if (player.boostCharges > 0) {
        iconEl.textContent = '🔥';
        nameEl.textContent = '부스터 사용 가능!';
      } else {
        iconEl.textContent = '🎲';
        nameEl.textContent = '상자 또는 드리프트';
      }

      document.getElementById('pip-1').classList.toggle('ready', player.boostCharges >= 1);
      document.getElementById('pip-2').classList.toggle('ready', player.boostCharges >= 2);
      document.getElementById('drift-bar').style.width = `${Math.min(100, player.driftGauge * 100)}%`;

      // 미니맵 그리기
      mCtx.clearRect(0, 0, 116, 116);
      mCtx.save();
      mCtx.translate(32, 62);
      mCtx.scale(0.19, 0.19);

      mCtx.beginPath();
      trackPoints.forEach((pt, i) => {
        if (i === 0) mCtx.moveTo(pt.x, pt.z);
        else mCtx.lineTo(pt.x, pt.z);
      });
      mCtx.closePath();
      mCtx.strokeStyle = '#94a3b8';
      mCtx.lineWidth = 18;
      mCtx.stroke();

      racers.forEach(r => {
        mCtx.beginPath();
        mCtx.arc(r.pos.x, r.pos.z, r.isPlayer ? 22 : 14, 0, Math.PI * 2);
        mCtx.fillStyle = r.isPlayer ? '#facc15' : '#ffffff';
        mCtx.fill();
        mCtx.strokeStyle = '#0f172a';
        mCtx.lineWidth = 5;
        mCtx.stroke();
      });
      mCtx.restore();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function finishPlayerRace() {
      gameState = 'RESULT';
      document.getElementById('speed-lines').classList.remove('active');
      sfx.playWin();

      document.getElementById('result-rank').textContent = `🏆 최종 ${player.rank}위 골인!`;
      document.getElementById('result-time').textContent = `완주 기록: ${formatTime(player.finishTime)} · 레이서: ${player.data.name}(${player.data.type})`;
      document.getElementById('result-screen').classList.remove('hidden');
    }

    /********************************************************************
     * 14. 카메라 추적 & 메인 애니메이션 루프
     ********************************************************************/
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // 아이템 상자 회전 및 리스폰
      itemBoxes.forEach(box => {
        box.mesh.rotation.y += dt * 2.2;
        if (box.cooldown > 0) {
          box.cooldown -= dt;
          if (box.cooldown <= 0) box.mesh.visible = true;
        }
      });

      // 함정 수명 관리
      for (let i = activeTraps.length - 1; i >= 0; i--) {
        activeTraps[i].life -= dt;
        if (activeTraps[i].life <= 0) {
          scene.remove(activeTraps[i].mesh);
          activeTraps.splice(i, 1);
        }
      }

      if (gameState === 'RACING') {
        raceElapsed += dt;
        racers.forEach(r => updateRacerPhysics(r, dt));
        resolveKartCollisions();
        updateRankings();
        updateHUD();
      }

      // 3인칭 추적 카메라
      if (player) {
        const camDist = (player.boostTimer > 0 || player.warpTimer > 0) ? 14.5 : 12.2;
        const desiredCamPos = new THREE.Vector3(
          player.pos.x - Math.sin(player.heading) * camDist,
          player.pos.y + 5.8,
          player.pos.z - Math.cos(player.heading) * camDist
        );
        camera.position.lerp(desiredCamPos, dt * 8.5);

        const lookTarget = new THREE.Vector3(
          player.pos.x + Math.sin(player.heading) * 8,
          player.pos.y + 1.8,
          player.pos.z + Math.cos(player.heading) * 8
        );
        camera.lookAt(lookTarget);
      } else {
        // 선택 화면일 때는 트랙 상공 회전 뷰
        const angle = now * 0.00025;
        camera.position.set(80 + Math.cos(angle) * 180, 75, -20 + Math.sin(angle) * 180);
        camera.lookAt(80, 0, -20);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
</body>
