<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>뽀로로반 문구 레이싱 3D - 메트로 시티 투어</title>
  <style>
    :root {
      --primary: #ffb703;
      --accent: #fb8500;
      --dark: #0f172a;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 부스터 속도선 이펙트 */
    #speed-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      background: radial-gradient(circle, transparent 42%, rgba(56, 189, 248, 0.28) 80%, rgba(250, 204, 21, 0.6) 100%);
      z-index: 5;
    }
    #speed-lines.active {
      opacity: 1;
      animation: pulseSpeed 0.14s infinite alternate;
    }
    @keyframes pulseSpeed {
      from { transform: scale(1); }
      to { transform: scale(1.03); }
    }

    /* 공통 오버레이 */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(7px);
    }
    .hidden {
      display: none !important;
    }

    /* 상단 설정 바 */
    #top-settings {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .setting-btn {
      background: rgba(15, 23, 42, 0.88);
      color: #f8fafc;
      border: 2px solid #475569;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .setting-btn.on {
      background: #fef08a;
      border-color: #eab308;
      color: #0f172a;
    }

    /* 레이서 선택 화면 */
    .title-header {
      text-align: center;
      margin-bottom: 12px;
      color: #fff;
    }
    .title-badge {
      display: inline-block;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #0f172a;
      font-weight: 900;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 5px;
    }
    .title-header h1 {
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 900;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
      letter-spacing: -0.5px;
    }
    .title-header p {
      font-size: 13.5px;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .racer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 210px));
      gap: 12px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 14px;
    }
    @media (max-width: 740px) {
      .racer-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: 60vh;
        overflow-y: auto;
      }
    }
    .racer-card {
      background: #ffffff;
      border: 4px solid #334155;
      border-radius: 18px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .racer-card.selected {
      border-color: #f59e0b;
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(245, 158, 11, 0.4);
    }
    .racer-preview {
      height: 78px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 8px;
      position: relative;
      border: 2px solid rgba(0,0,0,0.06);
    }
    .racer-num {
      position: absolute;
      bottom: 4px;
      right: 8px;
      font-size: 11px;
      font-weight: 900;
      background: #fff;
      color: #1e293b;
      border: 1.5px solid #1e293b;
      border-radius: 99px;
      padding: 1px 6px;
    }
    .racer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .racer-name {
      font-size: 18px;
      font-weight: 900;
      color: #0f172a;
    }
    .racer-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1.5px solid #1e293b;
    }
    .racer-desc {
      font-size: 11.5px;
      color: #475569;
      line-height: 1.35;
      margin-bottom: 6px;
      min-height: 30px;
    }
    .racer-skill {
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .racer-skill strong {
      display: block;
      color: #0f172a;
      margin-bottom: 1px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      font-size: 10.5px;
      color: #334155;
      margin-top: 3px;
      gap: 6px;
    }
    .stat-label {
      width: 42px;
      font-weight: 700;
    }
    .stat-bar-bg {
